[project]
name = "flowfolio"
version = "0.1.0"
description = "Flowfolio：單人接案與目標管理網站"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.4,<5",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

