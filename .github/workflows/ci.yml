name: Flowfolio 品質檢查

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 安裝 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: 安裝後端依賴
        run: |
          uv sync --dev
      - name: 執行後端測試
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          uv run pytest -n auto --junitxml=reports/backend-junit.xml
      - name: 執行後端靜態檢查
        run: |
          uv run ruff check backend
      - name: 上傳後端測試報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: windows-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 設定 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 編譯前端
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint:css
      - name: 安裝 Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: 執行前端版面與視覺測試
        working-directory: frontend
        run: npm run test:e2e
      - name: 上傳前端測試報告與失敗證據
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-reports
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

